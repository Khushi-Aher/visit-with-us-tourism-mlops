name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  register-dataset:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Register dataset
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          path = Path("data/tourism.csv")
          df = pd.read_csv(path)

          registration = {
              "dataset": str(path),
              "rows": int(df.shape[0]),
              "columns": int(df.shape[1]),
              "column_names": df.columns.tolist(),
              "registered": True
          }

          Path("data").mkdir(exist_ok=True)

          with open("data/registration_metadata.json", "w") as f:
              json.dump(registration, f, indent=2)

          print("Dataset registered successfully.")
          print(registration)
          PY

      - name: Upload registration record
        uses: actions/upload-artifact@v4
        with:
          name: dataset-registration
          path: data/registration_metadata.json


  data-prep:

    needs: register-dataset

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3

      - name: Run data preparation
        run: |
          python scripts/data_prep.py

      - name: Verify prepared dataset
        run: |
          test -f data/tourism_clean.csv
          echo "Data preparation completed successfully."
          wc -l data/tourism_clean.csv

      - name: Upload prepared dataset
        uses: actions/upload-artifact@v4
        with:
          name: prepared-dataset
          path: data/tourism_clean.csv


  model-training:

    needs: data-prep

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/requirements.txt

      - name: Train model
        run: |
          python scripts/train_model.py

      - name: Verify trained model
        run: |
          test -f deployment/model.joblib
          test -f deployment/model_metadata.json
          echo "Model training completed successfully."

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-model
          path: |
            deployment/model.joblib
            deployment/model_metadata.json


  deployment-check:

    needs: model-training

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          test -f deployment/app.py
          test -f deployment/model.joblib
          test -f deployment/model_metadata.json
          test -f deployment/requirements.txt
          echo "Deployment package verified."

      - name: Verify live Streamlit application
        env:
          APP_URL: https://visit-with-us-tourism-mlops-dr88gm2yuvvjjpufbc5vp6.streamlit.app
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ["APP_URL"]

          for attempt in range(5):
              try:
                  response = urllib.request.urlopen(url, timeout=30)
                  status = response.status
                  print(f"Streamlit app HTTP status: {status}")

                  if status == 200:
                      print("Live Streamlit application verified successfully.")
                      break

              except Exception as e:
                  print(f"Attempt {attempt + 1} failed: {e}")

              time.sleep(15)

          else:
              raise RuntimeError("Live Streamlit application could not be verified.")
          PY
