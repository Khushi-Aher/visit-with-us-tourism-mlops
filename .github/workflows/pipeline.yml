name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  register-dataset:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install registration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3

      - name: Register dataset
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          path = Path("data/tourism.csv")
          df = pd.read_csv(path)

          registration = {
              "dataset": str(path),
              "rows": int(df.shape[0]),
              "columns": int(df.shape[1]),
              "column_names": df.columns.tolist(),
              "registered": True
          }

          Path("data").mkdir(exist_ok=True)

          with open("data/registration_metadata.json", "w") as f:
              json.dump(registration, f, indent=2)

          print("Dataset registered successfully.")
          print(registration)
          PY

      - name: Upload registration record
        uses: actions/upload-artifact@v4
        with:
          name: dataset-registration
          path: data/registration_metadata.json


  data-prep:

    needs: register-dataset

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3

      - name: Run data preparation
        run: |
          python scripts/data_prep.py

      - name: Verify prepared dataset
        run: |
          test -f data/tourism_clean.csv
          echo "Data preparation completed successfully."
          wc -l data/tourism_clean.csv

      - name: Upload prepared dataset
        uses: actions/upload-artifact@v4
        with:
          name: prepared-dataset
          path: data/tourism_clean.csv


  model-training:

    needs: data-prep

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/requirements.txt

      - name: Train model
        run: |
          python scripts/train_model.py

      - name: Verify trained model
        run: |
          test -f deployment/model.joblib
          test -f deployment/model_metadata.json
          echo "Model training completed successfully."

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-model
          path: |
            deployment/model.joblib
            deployment/model_metadata.json


  deployment-check:

    needs: model-training

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment files
        run: |
          test -f deployment/app.py
          test -f deployment/model.joblib
          test -f deployment/model_metadata.json
          test -f deployment/requirements.txt

          echo "Deployment package verified successfully."
          echo "Streamlit application is deployed separately on Streamlit Community Cloud."
